<title>Crazy Diamonds - Scaletta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 25px;
    border-bottom: 2px solid #d4af37;
    padding-bottom: 15px;
  }
  header h1 { font-size: 2em; color: #d4af37; letter-spacing: 3px; text-transform: uppercase; }
  header p { color: #888; font-size: 0.9em; margin-top: 5px; }

  .config-bar {
    max-width: 1400px; margin: 0 auto 20px auto;
    background: #1a1a1a; border: 1px solid #444; border-radius: 8px;
    padding: 12px 18px; display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .config-bar label { color: #d4af37; font-weight: bold; font-size: 0.9em; }
  .config-bar .band-members {
    flex: 1; color: #ccc; font-size: 0.85em;
    font-style: italic; min-width: 200px;
  }
  .config-bar .band-members:empty::before {
    content: "⚠️ Nessun nome configurato — clicca 'Configura band'";
    color: #ff8888; font-style: normal;
  }
  .btn-config {
    background: transparent; color: #d4af37; border: 1px solid #d4af37;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 0.85em; font-weight: bold; transition: 0.2s;
  }
  .btn-config:hover { background: #d4af37; color: #0a0a0a; }

  /* Modale configurazione */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1a1a; border: 1px solid #d4af37; border-radius: 12px;
    padding: 24px; max-width: 500px; width: 90%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  }
  .modal h3 {
    color: #d4af37; margin-bottom: 8px;
    font-size: 1.2em; letter-spacing: 1px;
  }
  .modal p { color: #888; font-size: 0.85em; margin-bottom: 16px; }
  .modal textarea {
    width: 100%; min-height: 140px; padding: 10px;
    background: #0f0f0f; border: 1px solid #444; border-radius: 6px;
    color: #e0e0e0; font-family: inherit; font-size: 0.9em;
    resize: vertical;
  }
  .modal textarea:focus { outline: none; border-color: #d4af37; }
  .modal .modal-actions {
    display: flex; gap: 10px; margin-top: 16px;
  }
  .modal .modal-actions button { flex: 1; }

  .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

  .panel { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 18px; }
  .panel h2 {
    color: #d4af37; font-size: 1.1em; margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel h2 span { color: #666; font-size: 0.8em; font-weight: normal; }

  .search-box, .album-filter {
    width: 100%; padding: 8px 12px; background: #0f0f0f;
    border: 1px solid #333; border-radius: 6px; color: #e0e0e0;
    margin-bottom: 10px; font-size: 0.9em;
  }
  .search-box:focus, .album-filter:focus { outline: none; border-color: #d4af37; }
  .album-filter { cursor: pointer; }

  .add-form {
    background: #0f0f0f; border: 1px dashed #444; border-radius: 6px;
    padding: 12px; margin-bottom: 12px; display: none; flex-direction: column; gap: 8px;
  }
  .add-form.open { display: flex; }
  .add-form input {
    padding: 7px 10px; background: #1a1a1a; border: 1px solid #333;
    border-radius: 5px; color: #e0e0e0; font-size: 0.85em;
  }
  .add-form input:focus { outline: none; border-color: #d4af37; }
  .add-form .row { display: flex; gap: 8px; }
  .add-form .row input:first-child { flex: 3; }
  .add-form .row input:last-child { flex: 1; }
  .add-form .form-actions { display: flex; gap: 8px; }

  .btn-toggle-form {
    background: transparent; color: #d4af37; border: 1px solid #d4af37;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8em;
    margin-bottom: 10px; width: 100%; transition: 0.2s;
  }
  .btn-toggle-form:hover { background: #d4af37; color: #0a0a0a; }

  .song-list {
    max-height: 480px; overflow-y: auto; display: flex;
    flex-direction: column; gap: 6px;
  }
  .song-list::-webkit-scrollbar { width: 8px; }
  .song-list::-webkit-scrollbar-track { background: #0f0f0f; }
  .song-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  .song-item {
    background: #222; padding: 10px 14px; border-radius: 6px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    transition: all 0.2s; border-left: 3px solid transparent;
    font-size: 0.9em; gap: 8px;
  }
  .song-item:hover { background: #2a2a2a; border-left-color: #d4af37; }
  .song-item .album { color: #666; font-size: 0.75em; font-style: italic; }
  .song-item .add-icon { color: #d4af37; font-weight: bold; flex-shrink: 0; }
  .song-item .del-icon {
    color: #ff5555; background: transparent; border: none;
    font-size: 1.1em; cursor: pointer; padding: 0 4px; flex-shrink: 0;
  }
  .song-item .del-icon:hover { color: #ff8888; }

  .setlist-item {
    background: #222; padding: 10px 12px; border-radius: 6px;
    display: flex; align-items: center; gap: 10px;
    border-left: 3px solid #d4af37; font-size: 0.9em; cursor: grab;
  }
  .setlist-item.dragging { opacity: 0.4; }
  .setlist-item.drag-over { border-top: 3px solid #d4af37; }
  .setlist-item .num {
    background: #d4af37; color: #0a0a0a; width: 26px; height: 26px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 0.8em; flex-shrink: 0;
  }
  .setlist-item .title { flex: 1; }
  .setlist-item .album { color: #666; font-size: 0.75em; }

  /* Voci nella scaletta */
  .setlist-item .voices {
    display: flex; flex-direction: column; gap: 4px;
    flex-shrink: 0; width: 180px;
  }
  .setlist-item .voices select {
    background: #0f0f0f; border: 1px solid #444; border-radius: 4px;
    color: #e0e0e0; font-size: 0.75em; padding: 4px 6px;
    font-family: inherit; width: 100%; cursor: pointer;
  }
  .setlist-item .voices select:focus { outline: none; border-color: #d4af37; }

  /* Coro multi-select */
  .coro-box {
    position: relative;
  }
  .coro-btn {
    width: 100%; background: #0f0f0f; border: 1px solid #444;
    border-radius: 4px; color: #e0e0e0; font-size: 0.75em;
    padding: 4px 6px; cursor: pointer; text-align: left;
    font-family: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .coro-btn:focus { outline: none; border-color: #d4af37; }
  .coro-btn .placeholder { color: #666; }

  /* Dropdown FIXED - si sovrappone a tutto */
  .coro-dropdown {
    display: none;
    position: fixed;
    background: #1a1a1a;
    border: 1px solid #d4af37;
    border-radius: 6px;
    padding: 6px;
    z-index: 10000;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.9);
    min-width: 180px;
  }
  .coro-dropdown.open { display: block; }
  .coro-dropdown label {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; font-size: 0.78em; cursor: pointer;
    border-radius: 3px; color: #e0e0e0;
  }
  .coro-dropdown label:hover { background: #2a2a2a; }
  .coro-dropdown input[type="checkbox"] {
    accent-color: #d4af37; cursor: pointer;
  }
  .coro-dropdown .dropdown-divider {
    height: 1px; background: #333; margin: 4px 0;
  }
  .coro-dropdown .btn-mini {
    width: 100%; background: transparent; border: none;
    color: #d4af37; font-size: 0.75em; padding: 5px 8px;
    cursor: pointer; text-align: left; font-weight: bold;
  }
  .coro-dropdown .btn-mini:hover { background: #2a2a2a; }

  .setlist-item .voices .voice-print { display: none; }
  @media (max-width: 900px) { .setlist-item .voices { width: 140px; } }

  .btn {
    background: #d4af37; color: #0a0a0a; border: none;
    padding: 10px 18px; border-radius: 6px; cursor: pointer;
    font-weight: bold; font-size: 0.9em; transition: 0.2s;
  }
  .btn:hover { background: #e8c860; }
  .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: #d4af37; border: 1px solid #d4af37; }
  .btn-secondary:hover { background: #d4af37; color: #0a0a0a; }
  .btn-danger {
    background: transparent; color: #ff5555; border: 1px solid #ff5555;
    padding: 4px 10px; font-size: 0.75em;
  }
  .btn-danger:hover { background: #ff5555; color: white; }
  .btn-del { background: transparent; color: #ff5555; border: none; font-size: 1.2em; cursor: pointer; padding: 0 6px; }

  .actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .actions .btn { flex: 1; }

  .empty { text-align: center; color: #555; padding: 30px; font-style: italic; font-size: 0.9em; }

  .stats {
    display: flex; justify-content: space-between; font-size: 0.85em;
    color: #888; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #d4af37; color: #0a0a0a; padding: 10px 24px;
    border-radius: 8px; font-weight: bold; font-size: 0.9em;
    transition: transform 0.3s, opacity 0.3s; z-index: 1000; opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media print {
    @page { size: A4 portrait; margin: 1cm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    html, body { background: white; color: black; padding: 0; margin: 0; width: 100%; height: auto; }
    body { font-size: 11px; }

    header {
      margin: 0 0 8px 0; padding-bottom: 6px;
      border-bottom: 2px solid black; text-align: center;
      page-break-after: avoid; break-after: avoid;
    }
    header h1 { color: black; font-size: 1.7em; letter-spacing: 2px; }
    header p { color: #555; font-size: 0.8em; margin-top: 2px; }

    .config-bar, .modal-overlay, .coro-dropdown { display: none !important; }
    .container { display: block; max-width: 100%; width: 100%; }
    #catalog-panel, .search-box, .album-filter, .btn-toggle-form,
    .add-form, .actions, .btn-del, .toast, .empty { display: none !important; }

    #setlist-panel {
      border: none; padding: 0; background: white; display: block;
      page-break-inside: avoid; break-inside: avoid;
    }
    #setlist-panel h2 {
      color: black; font-size: 1.15em; border-bottom: 2px solid black;
      padding-bottom: 4px; margin: 0 0 8px 0;
      page-break-after: avoid; break-after: avoid;
    }
    #setlist-panel h2 span { color: #555; }

    #setlist {
      display: flex; flex-direction: column; justify-content: flex-start;
      gap: 4px; max-height: none; overflow: hidden; margin: 0; padding: 0;
    }

    .setlist-item {
      background: white; border-left: 4px solid black; color: black;
      padding: var(--print-padding, 6px 10px);
      font-size: var(--print-font-size, 13px);
      page-break-inside: avoid; break-inside: avoid; cursor: default;
      border-radius: 4px; box-sizing: border-box;
      display: flex; align-items: center; overflow: hidden;
    }
    .setlist-item .num {
      width: var(--print-num-size, 26px); height: var(--print-num-size, 26px);
      font-size: var(--print-num-font, 13px); background: black; color: white;
      flex-shrink: 0;
    }
    .setlist-item .album { color: #666; font-size: var(--print-album-font, 11px); }

    .setlist-item .voices {
      display: flex; flex-direction: column; gap: 0;
      width: 35%; flex-shrink: 0; text-align: right;
      font-size: calc(var(--print-font-size, 13px) * 0.8);
      line-height: 1.15;
    }
    .setlist-item .voices select,
    .setlist-item .voices .coro-box { display: none; }
    .setlist-item .voices .voice-print { display: block; }
    .setlist-item .voices .voice-print:empty { display: none; }
    .setlist-item .voices .voice-print b { font-weight: bold; }

    .stats {
      color: #333; font-size: 1em; margin-top: 8px; padding-top: 6px;
      border-top: 2px solid #999; font-weight: bold;
      page-break-before: avoid; break-before: avoid;
    }
    .stats span:last-child { display: none; }
  }
</style>
</head>

<header>
  <h1>💎 Crazy Diamonds</h1>
  <p>Pink Floyd Tribute Band — Scaletta Live</p>
</header>

<div class="config-bar">
  <label>🎤 Band:</label>
  <span class="band-members" id="band-members-display"></span>
  <button class="btn-config" onclick="apriConfigurazione()">⚙️ Configura band</button>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>⚙️ Configura la band</h3>
    <p>Inserisci i nomi dei componenti della band, <strong>uno per riga</strong> (o separati da virgola). Appariranno nelle tendine della scaletta.</p>
    <textarea id="band-input" placeholder="Esempio:&#10;Marco&#10;Luca&#10;Anna&#10;Sara"></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="chiudiConfigurazione()">Annulla</button>
      <button class="btn" onclick="salvaConfigurazione()">💾 Salva</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="panel" id="catalog-panel">
    <h2>Catalogo Brani <span id="catalog-count"></span></h2>
    <button class="btn-toggle-form" onclick="toggleForm()" id="toggle-form-btn">➕ Aggiungi brano al catalogo</button>
    <div class="add-form" id="add-form">
      <input type="text" id="new-titolo" placeholder="Titolo brano *">
      <input type="text" id="new-album" placeholder="Album (opzionale)">
      <div class="row">
        <input type="number" id="new-durata" placeholder="Durata in minuti" step="0.1" min="0">
        <button class="btn" onclick="aggiungiAlCatalogo()">Salva</button>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="toggleForm()" style="flex:1;">Annulla</button>
      </div>
    </div>
    <select class="album-filter" id="album-filter" onchange="renderCatalogo()">
      <option value="">🎵 Tutti gli album</option>
    </select>
    <input type="text" class="search-box" id="search" placeholder="🔍 Cerca brano o album...">
    <div class="song-list" id="catalog"></div>
  </div>

  <div class="panel" id="setlist-panel">
    <h2>Scaletta Concerto <span id="setlist-count"></span></h2>
    <div class="song-list" id="setlist"></div>
    <div class="stats">
      <span id="total-time">Durata: 0:00</span>
      <span>Trascina per riordinare</span>
    </div>
    <div class="actions">
      <button class="btn" onclick="printPDF()" id="print-btn" disabled>🖨️ Stampa PDF</button>
      <button class="btn btn-danger" onclick="clearSetlist()" id="clear-btn" disabled>Svuota Scaletta</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let membriBand = JSON.parse(localStorage.getItem('cd_membri_band') || '[]');

function salvaMembri() {
  localStorage.setItem('cd_membri_band', JSON.stringify(membriBand));
}

function aggiornaBarraBand() {
  const el = document.getElementById('band-members-display');
  if (membriBand.length === 0) {
    el.textContent = '';
  } else {
    el.textContent = membriBand.join(' · ');
  }
}

function apriConfigurazione() {
  const ta = document.getElementById('band-input');
  ta.value = membriBand.join('\n');
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => ta.focus(), 100);
}

function chiudiConfigurazione() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function salvaConfigurazione() {
  const raw = document.getElementById('band-input').value;
  const nomi = raw.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
  const unici = [...new Set(nomi)];
  membriBand = unici;
  salvaMembri();
  aggiornaBarraBand();
  chiudiConfigurazione();
  renderScaletta();
  showToast(`✅ Band aggiornata (${membriBand.length} membri)`);
}

let catalogoCustom = JSON.parse(localStorage.getItem('cd_catalogo_custom') || '{"aggiunti":[],"rimossi":[]}');
if (!catalogoCustom.aggiunti) catalogoCustom.aggiunti = [];
if (!catalogoCustom.rimossi) catalogoCustom.rimossi = [];

let scaletta = JSON.parse(localStorage.getItem('cd_setlist') || '[]');

function getCatalogo() {
  const base = CATALOGO_BASE.filter(s => !catalogoCustom.rimossi.includes(s.titolo));
  const custom = catalogoCustom.aggiunti.filter(s => !catalogoCustom.rimossi.includes(s.titolo));
  return [...base, ...custom];
}

function isBranoBase(titolo) { return CATALOGO_BASE.some(s => s.titolo === titolo); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function popolaFiltroAlbum() {
  const catalogo = getCatalogo();
  const albums = [...new Set(catalogo.map(s => s.album))].sort();
  const select = document.getElementById('album-filter');
  const current = select.value;
  select.innerHTML = '<option value="">🎵 Tutti gli album</option>' +
    albums.map(a => `<option value="${a.replace(/"/g, '&quot;')}">${a}</option>`).join('');
  if (albums.includes(current)) select.value = current;
}

function renderCatalogo() {
  const catalogo = getCatalogo();
  const q = document.getElementById('search').value.toLowerCase().trim();
  const albumFiltro = document.getElementById('album-filter').value;
  const catalogEl = document.getElementById('catalog');

  let filtrate = catalogo;
  if (albumFiltro) filtrate = filtrate.filter(s => s.album === albumFiltro);
  if (q) filtrate = filtrate.filter(s =>
    s.titolo.toLowerCase().includes(q) || s.album.toLowerCase().includes(q)
  );

  document.getElementById('catalog-count').textContent = `(${catalogo.length})`;

  if (filtrate.length === 0) {
    catalogEl.innerHTML = '<div class="empty">Nessun brano trovato</div>';
    return;
  }

  catalogEl.innerHTML = filtrate.map(s => {
    const titoloSafe = s.titolo.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `<div class="song-item">
      <div style="flex:1;" onclick="aggiungi('${titoloSafe}')">
        <div>${s.titolo}</div>
        <div class="album">${s.album || '—'}</div>
      </div>
      <span class="add-icon" onclick="aggiungi('${titoloSafe}')" style="cursor:pointer;">+</span>
      <button class="del-icon" title="Rimuovi dal catalogo" onclick="event.stopPropagation(); rimuoviDalCatalogo('${titoloSafe}')">🗑</button>
    </div>`;
  }).join('');
}

function opzioniSelect(lista, selezionato) {
  let html = `<option value="">—</option>`;
  for (const nome of lista) {
    const sel = (nome === selezionato) ? ' selected' : '';
    html += `<option value="${nome.replace(/"/g, '&quot;')}"${sel}>${nome}</option>`;
  }
  return html;
}

function renderScaletta() {
  const setEl = document.getElementById('setlist');
  const count = scaletta.length;
  document.getElementById('setlist-count').textContent = `(${count})`;
  document.getElementById('print-btn').disabled = count === 0;
  document.getElementById('clear-btn').disabled = count === 0;

  const totMin = scaletta.reduce((a, s) => a + (s.durata || 0), 0);
  const h = Math.floor(totMin / 60);
  const m = Math.floor(totMin % 60);
  document.getElementById('total-time').textContent =
    `Durata: ${h > 0 ? h + 'h ' : ''}${m}min`;

  if (count === 0) {
    setEl.innerHTML = '<div class="empty">Clicca sui brani a sinistra per aggiungerli alla scaletta</div>';
    return;
  }

  setEl.innerHTML = scaletta.map((s, i) => {
    const coroArr = Array.isArray(s.coro) ? s.coro : [];
    const coroTxt = coroArr.length === 0
      ? '<span class="placeholder">👥 Coro...</span>'
      : '👥 ' + coroArr.join(', ');
    const coroChecks = membriBand.map(nome => {
      const checked = coroArr.includes(nome) ? 'checked' : '';
      return `<label><input type="checkbox" ${checked}
              onchange="toggleCoro(${i}, '${nome.replace(/'/g, "\\'")}', this.checked)"> ${nome}</label>`;
    }).join('');
    const voicePrint = `
      ${s.voceSolista ? '🎤 <b>' + s.voceSolista + '</b>' : ''}
      ${s.voceSolista && coroArr.length > 0 ? '<br>' : ''}
      ${coroArr.length > 0 ? '👥 ' + coroArr.join(', ') : ''}
    `;
    return `
    <div class="setlist-item" draggable="true" data-index="${i}">
      <div class="num">${i + 1}</div>
      <div class="title">
        ${s.titolo}
        <div class="album">${s.album || '—'}</div>
      </div>
      <div class="voices">
        <select onchange="aggiornaSolista(${i}, this.value)"
                onmousedown="event.stopPropagation()"
                title="Voce solista">
          ${opzioniSelect(membriBand, s.voceSolista)}
        </select>
        <div class="coro-box">
          <button class="coro-btn" onclick="toggleCoroDropdown(event, ${i})"
                  onmousedown="event.stopPropagation()"
                  title="Coro (selezione multipla)">${coroTxt}</button>
          <div class="coro-dropdown" id="coro-dd-${i}">
            ${membriBand.length === 0
              ? '<div style="padding:6px;font-size:0.75em;color:#888;">Configura prima i nomi della band</div>'
              : `<button class="btn-mini" onclick="impostaCoroTutti(${i})">Seleziona tutti</button>
                 <button class="btn-mini" onclick="impostaCoroNessuno(${i})">Deseleziona tutti</button>
                 <div class="dropdown-divider"></div>
                 ${coroChecks}`}
          </div>
        </div>
        <span class="voice-print">${voicePrint}</span>
      </div>
      <button class="btn-del" onclick="rimuovi(${i}); event.stopPropagation();">×</button>
    </div>
  `;
  }).join('');

  setupDragDrop();
}

// Dropdown coro - FIXED, sovrapposta, posizionata via JS
function toggleCoroDropdown(event, i) {
  event.stopPropagation();
  const dd = document.getElementById('coro-dd-' + i);
  const wasOpen = dd.classList.contains('open');

  document.querySelectorAll('.coro-dropdown').forEach(d => d.classList.remove('open'));

  if (wasOpen) return;

  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();

  dd.style.visibility = 'hidden';
  dd.classList.add('open');

  const ddWidth = Math.max(rect.width, 200);
  const ddHeight = dd.offsetHeight;

  let left = rect.right - ddWidth;
  let top = rect.bottom + 4;

  if (left < 10) left = 10;
  if (left + ddWidth > window.innerWidth - 10) {
    left = window.innerWidth - ddWidth - 10;
  }

  if (top + ddHeight > window.innerHeight - 10) {
    top = rect.top - ddHeight - 4;
    if (top < 10) top = 10;
  }

  dd.style.left = left + 'px';
  dd.style.top = top + 'px';
  dd.style.width = ddWidth + 'px';
  dd.style.visibility = 'visible';
}

function toggleCoro(i, nome, checked) {
  if (!scaletta[i]) return;
  if (!Array.isArray(scaletta[i].coro)) scaletta[i].coro = [];
  if (checked) {
    if (!scaletta[i].coro.includes(nome)) scaletta[i].coro.push(nome);
  } else {
    scaletta[i].coro = scaletta[i].coro.filter(n => n !== nome);
  }
  salva();
  aggiornaCoroUI(i);
}

function impostaCoroTutti(i) {
  if (!scaletta[i]) return;
  scaletta[i].coro = [...membriBand];
  salva();
  const dd = document.getElementById('coro-dd-' + i);
  if (dd) dd.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
  aggiornaCoroUI(i);
}

function impostaCoroNessuno(i) {
  if (!scaletta[i]) return;
  scaletta[i].coro = [];
  salva();
  const dd = document.getElementById('coro-dd-' + i);
  if (dd) dd.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  aggiornaCoroUI(i);
}

function aggiornaCoroUI(i) {
  const btn = document.querySelector(`.setlist-item[data-index="${i}"] .coro-btn`);
  const printEl = document.querySelector(`.setlist-item[data-index="${i}"] .voice-print`);
  const arr = Array.isArray(scaletta[i].coro) ? scaletta[i].coro : [];
  if (btn) {
    btn.innerHTML = arr.length === 0
      ? '<span class="placeholder">👥 Coro...</span>'
      : '👥 ' + arr.join(', ');
  }
  if (printEl) {
    const s = scaletta[i];
    printEl.innerHTML = `
      ${s.voceSolista ? '🎤 <b>' + s.voceSolista + '</b>' : ''}
      ${s.voceSolista && arr.length > 0 ? '<br>' : ''}
      ${arr.length > 0 ? '👥 ' + arr.join(', ') : ''}
    `;
  }
}

function aggiornaSolista(i, valore) {
  if (scaletta[i]) {
    scaletta[i].voceSolista = valore;
    salva();
    const printEl = document.querySelector(`.setlist-item[data-index="${i}"] .voice-print`);
    if (printEl) {
      const arr = Array.isArray(scaletta[i].coro) ? scaletta[i].coro : [];
      printEl.innerHTML = `
        ${valore ? '🎤 <b>' + valore + '</b>' : ''}
        ${valore && arr.length > 0 ? '<br>' : ''}
        ${arr.length > 0 ? '👥 ' + arr.join(', ') : ''}
      `;
    }
  }
}

function toggleForm() { document.getElementById('add-form').classList.toggle('open'); }

function aggiungiAlCatalogo() {
  const titolo = document.getElementById('new-titolo').value.trim();
  const album = document.getElementById('new-album').value.trim();
  const durata = parseFloat(document.getElementById('new-durata').value) || 0;
  if (!titolo) { showToast('⚠️ Inserisci almeno il titolo'); return; }
  const esistente = getCatalogo().find(s => s.titolo.toLowerCase() === titolo.toLowerCase());
  if (esistente) { showToast('⚠️ Brano già presente'); return; }
  if (catalogoCustom.rimossi.includes(titolo)) {
    catalogoCustom.rimossi = catalogoCustom.rimossi.filter(t => t !== titolo);
  } else {
    catalogoCustom.aggiunti.push({ titolo, album, durata });
  }
  salvaCatalogo();
  document.getElementById('new-titolo').value = '';
  document.getElementById('new-album').value = '';
  document.getElementById('new-durata').value = '';
  document.getElementById('add-form').classList.remove('open');
  popolaFiltroAlbum();
  renderCatalogo();
  showToast('✅ Brano aggiunto');
}

function rimuoviDalCatalogo(titolo) {
  if (!confirm(`Rimuovere "${titolo}" dal catalogo?`)) return;
  if (scaletta.some(s => s.titolo === titolo)) {
    if (!confirm(`"${titolo}" è in scaletta. Rimuoverlo anche da lì?`)) return;
    scaletta = scaletta.filter(s => s.titolo !== titolo);
    salva();
    renderScaletta();
  }
  catalogoCustom.aggiunti = catalogoCustom.aggiunti.filter(s => s.titolo !== titolo);
  if (isBranoBase(titolo) && !catalogoCustom.rimossi.includes(titolo)) {
    catalogoCustom.rimossi.push(titolo);
  }
  salvaCatalogo();
  popolaFiltroAlbum();
  renderCatalogo();
  showToast('🗑 Brano rimosso');
}

function aggiungi(titolo) {
  const brano = getCatalogo().find(s => s.titolo === titolo);
  if (brano) {
    scaletta.push({
      ...brano,
      voceSolista: brano.voceSolista || '',
      coro: Array.isArray(brano.coro) ? brano.coro : []
    });
    salva();
    renderScaletta();
  }
}

function rimuovi(i) { scaletta.splice(i, 1); salva(); renderScaletta(); }

function clearSetlist() {
  if (confirm('Svuotare tutta la scaletta?')) { scaletta = []; salva(); renderScaletta(); }
}

function salva() { localStorage.setItem('cd_setlist', JSON.stringify(scaletta)); }
function salvaCatalogo() { localStorage.setItem('cd_catalogo_custom', JSON.stringify(catalogoCustom)); }

let dragIndex = null;
function setupDragDrop() {
  document.querySelectorAll('.setlist-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragIndex = parseInt(item.dataset.index);
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const targetIndex = parseInt(item.dataset.index);
      if (dragIndex === null || dragIndex === targetIndex) return;
      const moved = scaletta.splice(dragIndex, 1)[0];
      scaletta.splice(targetIndex, 0, moved);
      dragIndex = null;
      salva();
      renderScaletta();
    });
  });
}

function calcolaStileStampa() {
  const n = scaletta.length;
  if (n === 0) return;
  const root = document.documentElement;
  const setlist = document.getElementById('setlist');

  setlist.style.height = 'auto';
  setlist.style.gap = '4px';
  document.querySelectorAll('.setlist-item').forEach(el => {
    el.style.height = '';
    el.style.minHeight = '';
  });
  root.style.setProperty('--print-font-size', '13px');
  root.style.setProperty('--print-padding', '6px 10px');

  const A4_H = 1047;
  const OVERHEAD = 175;
  const spazioLista = A4_H - OVERHEAD;
  const gapTotale = (n - 1) * 4;
  const altezzaRiga = (spazioLista - gapTotale) / n;

  let fontSize = Math.min(22, Math.max(8, altezzaRiga * 0.36));
  let padding = Math.max(2, Math.min(14, altezzaRiga * 0.14));
  let numSize = Math.max(14, Math.min(38, altezzaRiga * 0.48));
  let numFont = Math.max(8, Math.min(18, altezzaRiga * 0.26));
  let albumFont = Math.max(7, Math.min(12, altezzaRiga * 0.16));

  fontSize = Math.round(fontSize * 2) / 2;
  padding = Math.round(padding * 2) / 2;

  root.style.setProperty('--print-font-size', fontSize + 'px');
  root.style.setProperty('--print-padding', padding + 'px 10px');
  root.style.setProperty('--print-num-size', numSize + 'px');
  root.style.setProperty('--print-num-font', numFont + 'px');
  root.style.setProperty('--print-album-font', albumFont + 'px');

  document.querySelectorAll('.setlist-item').forEach(el => {
    el.style.height = altezzaRiga + 'px';
    el.style.minHeight = altezzaRiga + 'px';
  });

  setlist.style.height = (n * altezzaRiga + gapTotale) + 'px';
}

function printPDF() {
  calcolaStileStampa();
  window.print();
}

['new-titolo','new-album','new-durata'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') aggiungiAlCatalogo();
  });
});

aggiornaBarraBand();
popolaFiltroAlbum();
renderCatalogo();
renderScaletta();
